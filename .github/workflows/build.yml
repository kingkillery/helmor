name: Build

# Frontend + Storybook build verification on the primary shipping platforms.
# Full Tauri bundles are produced by publish.yml on tag push; this workflow
# just ensures the web app still compiles cleanly on macOS and Windows.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CI: true

jobs:
  app-build:
    name: App Build
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-latest
            platform-name: macOS
          - runs-on: windows-latest
            platform-name: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Run app build
        run: bun run build

  storybook-build:
    name: Storybook Build
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-latest
            platform-name: macOS
          - runs-on: windows-latest
            platform-name: Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JS toolchain
        uses: ./.github/actions/setup-js

      - name: Run Storybook build
        run: bun run build-storybook
